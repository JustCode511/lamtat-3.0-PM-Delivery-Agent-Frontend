<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Bar chart bars -->
  <rect x="4"  y="20" width="5" height="8"  rx="1.5" fill="url(#accent)" opacity="0.55"/>
  <rect x="11" y="14" width="5" height="14" rx="1.5" fill="url(#accent)" opacity="0.80"/>
  <rect x="18" y="10" width="5" height="18" rx="1.5" fill="url(#accent)"/>

  <!-- AI node dot + pulse ring -->
  <circle cx="27" cy="7" r="3.5" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.4"/>
  <circle cx="27" cy="7" r="2"   fill="#22d3ee"/>

  <!-- Connector lines from node to top of tallest bar -->
  <line x1="25" y1="8.5" x2="22" y2="10" stroke="#22d3ee" stroke-width="0.9" opacity="0.55"/>
</svg>
